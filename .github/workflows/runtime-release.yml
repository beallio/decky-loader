name: Runtime Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Rust release tag, for example v3.2.10-rust.7-rc.1
        required: true
        type: string
      release_channel:
        description: The release channel must agree with the tag suffix
        required: true
        default: preview
        type: choice
        options:
          - stable
          - preview
      publish:
        description: Publish this release (requires the main branch)
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate-tag:
    runs-on: ubuntu-22.04
    steps:
      - name: Require the tag and channel to agree
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
        run: |
          stable_tag='^v[0-9]+\.[0-9]+\.[0-9]+-rust\.[0-9]+$'
          preview_tag='^v[0-9]+\.[0-9]+\.[0-9]+-rust\.[0-9]+-rc\.[0-9]+$'
          if [[ "$RELEASE_CHANNEL" == stable && ! "$RELEASE_TAG" =~ $stable_tag ]]; then
            printf 'Stable releases require a vX.Y.Z-rust.N tag\n' >&2
            exit 1
          fi
          if [[ "$RELEASE_CHANNEL" == preview && ! "$RELEASE_TAG" =~ $preview_tag ]]; then
            printf 'Preview releases require a vX.Y.Z-rust.N-rc.N tag\n' >&2
            exit 1
          fi

  build:
    needs: validate-tag
    uses: ./.github/workflows/runtime-build.yml
    with:
      release_version: ${{ inputs.release_tag }}

  publish:
    name: Verify payload and optionally publish the release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Require the main ref for production publication
        if: inputs.publish
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            printf 'Production publication is allowed only from refs/heads/main\n' >&2
            exit 1
          fi

      - name: Check out the selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download the complete runtime artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: decky-loader-runtime-linux-x86_64
          path: ${{ runner.temp }}/runtime-release

      - name: Read pinned Python
        id: config
        run: printf 'python=%s\n' "$(jq -r .python.version backend-rust/build-config.json)" >> "$GITHUB_OUTPUT"

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ steps.config.outputs.python }}

      # An installed loader runs its own installer first when it updates in Decky, so the newest
      # published release must accept this bundle; otherwise users need a bridge release.
      - name: Check the bundle with the previous release's installer
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/runtime-release
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [[ -z "$previous" ]]; then
            echo "No published release yet; nothing to check."
            exit 0
          fi
          check="$RUNNER_TEMP/previous-installer-check"
          mkdir -p "$check/previous" "$check/bundle"
          gh release download "$previous" --repo "$GITHUB_REPOSITORY" \
            --pattern decky-loader-runtime-linux-x86_64.zip --dir "$check"
          unzip -q "$check/decky-loader-runtime-linux-x86_64.zip" install.py process_observer.py -d "$check/previous"
          unzip -q "$ARTIFACT_DIR/decky-loader-runtime-linux-x86_64.zip" -d "$check/bundle"
          python3 -B - "$check/previous/install.py" "$check/bundle" "$previous" <<'PY'
          import importlib.util, os, pwd, sys
          installer, bundle, previous = sys.argv[1:4]
          sys.path.insert(0, os.path.dirname(installer))
          spec = importlib.util.spec_from_file_location('previous_installer', installer)
          module = sys.modules['previous_installer'] = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module._validate_bundle(bundle, pwd.getpwuid(os.geteuid()))
          print(f'The {previous} installer accepts this bundle.')
          PY

      - name: Verify release identity and every payload checksum
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/runtime-release
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          SOURCE_COMMIT: ${{ github.sha }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_REF: ${{ github.ref }}
          PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          publish_args=()
          if [[ "$PUBLISH" == true ]]; then
            publish_args=(--publish --ref "$RELEASE_REF")
          fi
          python3 scripts/runtime/release.py \
            --artifact-dir "$ARTIFACT_DIR" \
            --tag "$RELEASE_TAG" \
            --channel "$RELEASE_CHANNEL" \
            --source-commit "$SOURCE_COMMIT" \
            --repository "$RELEASE_REPOSITORY" \
            "${publish_args[@]}"

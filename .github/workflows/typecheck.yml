name: Type Check

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  typecheck:
    name: Check SDK and frontend types
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use the runner temporary directory
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Read pinned tools
        id: config
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(Path('backend-rust/build-config.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name in ('node', 'pnpm', 'poetry', 'poetry_dynamic_versioning'):
                  print(f'{name}={config[name]}', file=output)
              print(f'python={config["python"]["version"]}', file=output)
              print(f'sdk_version={config["sdk"]["tag"].removeprefix("v")}', file=output)
          PY
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ steps.config.outputs.node }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ steps.config.outputs.python }}
      - name: Install pinned Python tools
        env:
          POETRY_VERSION: ${{ steps.config.outputs.poetry }}
          VERSIONING_VERSION: ${{ steps.config.outputs.poetry_dynamic_versioning }}
        run: python3 -m pip install "poetry==$POETRY_VERSION" "poetry-dynamic-versioning==$VERSIONING_VERSION"
      - name: Install locked SDK dependencies
        working-directory: backend
        env:
          POETRY_VIRTUALENVS_IN_PROJECT: "true"
          POETRY_DYNAMIC_VERSIONING_BYPASS: ${{ steps.config.outputs.sdk_version }}
        run: poetry sync --no-interaction
      - name: Check Python SDK types
        working-directory: backend
        run: poetry run pyright --pythonversion 3.11
      - name: Install locked frontend dependencies
        env:
          PNPM_VERSION: ${{ steps.config.outputs.pnpm }}
        run: |
          npm install --global "pnpm@$PNPM_VERSION"
          pnpm --dir frontend install --frozen-lockfile
      - name: Check frontend types
        run: pnpm --dir frontend run typecheck

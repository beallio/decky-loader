name: Rust Dependency Audit

on:
  workflow_call:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RUSTSEC_ADVISORY_DB: ${{ github.workspace }}/.rustsec-advisory-db
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal

      - name: Install pinned audit tools
        run: |
          cargo +1.98.1 install --locked --version 0.22.2 cargo-audit
          cargo +1.98.1 install --locked --version 0.20.2 cargo-deny
          cargo +1.98.1 install --locked --version 0.9.2 cargo-machete

      - name: Fetch current official advisory database
        run: gh repo clone RustSec/advisory-db "$RUSTSEC_ADVISORY_DB" -- --depth 1

      - name: Check the complete locked dependency graph
        working-directory: backend-rust
        run: ./audit.sh

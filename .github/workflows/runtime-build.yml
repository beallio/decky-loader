name: Runtime Builder

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: Rust candidate version; does not publish a release
        default: dev
        type: string
  workflow_call:
    inputs:
      release_version:
        description: Rust candidate version; does not publish a release
        default: dev
        required: false
        type: string

permissions:
  contents: read

jobs:
  dependencies:
    uses: ./.github/workflows/runtime-dependencies.yml

  build:
    name: Build complete Linux runtime
    needs: dependencies
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_VERSION: ${{ inputs.release_version || 'dev' }}
    steps:
      - name: Use the runner temporary directory
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Check out complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Read pinned build configuration
        id: config
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(Path('backend-rust/build-config.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('node', 'pnpm', 'rust'):
                  print(f'{key}={config[key]}', file=output)
              print(f'sdk_tag={config["sdk"]["tag"]}', file=output)
          PY

      - name: Fetch pinned SDK release baseline
        env:
          SDK_TAG: ${{ steps.config.outputs.sdk_tag }}
        run: git fetch --no-tags https://github.com/SteamDeckHomebrew/decky-loader.git "refs/tags/$SDK_TAG:refs/tags/$SDK_TAG"

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ steps.config.outputs.node }}

      - name: Set up pinned package manager and Rust
        env:
          PNPM_VERSION: ${{ steps.config.outputs.pnpm }}
          RUST_VERSION: ${{ steps.config.outputs.rust }}
        run: |
          npm install --global "pnpm@$PNPM_VERSION"
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt

      - name: Check the runtime and installer
        working-directory: backend-rust
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.config.outputs.rust }}
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace

      - name: Check runtime and installer regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests/runtime -p 'test_*.py'

      - name: Build the complete pinned candidate
        run: |
          python3 scripts/runtime/build.py \
            --release-version "$CANDIDATE_VERSION" \
            --output "$RUNNER_TEMP/decky-runtime"

      - name: Upload the complete runtime bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: decky-loader-runtime-linux-x86_64
          path: |
            ${{ runner.temp }}/decky-runtime/decky-loader-runtime-linux-x86_64.zip
            ${{ runner.temp }}/decky-runtime/decky-loader-runtime-linux-x86_64.zip.sha256
            ${{ runner.temp }}/decky-runtime/SHA256SUMS
            ${{ runner.temp }}/decky-runtime/build-result.json
          if-no-files-found: error

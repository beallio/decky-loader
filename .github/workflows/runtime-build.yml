name: Runtime Builder

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: Rust candidate version; does not publish a release
        default: dev
        type: string
  workflow_call:
    inputs:
      release_version:
        description: Rust candidate version; does not publish a release
        default: dev
        required: false
        type: string

permissions:
  contents: read

jobs:
  dependencies:
    uses: ./.github/workflows/runtime-dependencies.yml

  # The audit runs beside the build; a caller (Runtime Release) still fails if either job fails.
  build:
    name: Build complete Linux runtime
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_VERSION: ${{ inputs.release_version || 'dev' }}
    steps:
      - name: Use the runner temporary directory
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Check out complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Read pinned build configuration
        id: config
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(Path('backend-rust/build-config.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('node', 'pnpm', 'rust', 'uv'):
                  print(f'{key}={config[key]}', file=output)
              print(f'python={config["python"]["version"]}', file=output)
              print(f'sdk_tag={config["sdk"]["tag"]}', file=output)
          PY

      - name: Fetch pinned SDK release baseline
        env:
          SDK_TAG: ${{ steps.config.outputs.sdk_tag }}
        run: git fetch --no-tags https://github.com/SteamDeckHomebrew/decky-loader.git "refs/tags/$SDK_TAG:refs/tags/$SDK_TAG"

      - name: Set up pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ steps.config.outputs.node }}

      - name: Set up pinned package manager and Rust
        env:
          PNPM_VERSION: ${{ steps.config.outputs.pnpm }}
          RUST_VERSION: ${{ steps.config.outputs.rust }}
        run: |
          npm install --global "pnpm@$PNPM_VERSION"
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt

      # Registry and dependency build output; dev candidates below also build into this target.
      - name: Restore the Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.config.outputs.rust }}
        with:
          workspaces: backend-rust -> target
          save-if: ${{ github.ref == 'refs/heads/main' && env.CANDIDATE_VERSION == 'dev' }}

      - name: Check the runtime and installer
        working-directory: backend-rust
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.config.outputs.rust }}
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace

      # The installer and the plugin runtime need Python 3.11; the runner's system Python is 3.10.
      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ steps.config.outputs.python }}

      - name: Install pinned uv
        env:
          UV_VERSION: ${{ steps.config.outputs.uv }}
        run: python3 -m pip install "uv==$UV_VERSION"

      - name: Check runtime and installer regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests/runtime -p 'test_*.py'

      - name: Build the complete pinned candidate
        run: |
          # Releases compile from a clean target; dev candidates reuse the cached one.
          target=()
          if [[ $CANDIDATE_VERSION == dev ]]; then
            target=(--cargo-target-dir "$GITHUB_WORKSPACE/backend-rust/target")
          fi
          python3 scripts/runtime/build.py \
            --release-version "$CANDIDATE_VERSION" \
            --output "$RUNNER_TEMP/decky-runtime" "${target[@]}"

      - name: Upload the complete runtime bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: decky-loader-runtime-linux-x86_64
          path: |
            ${{ runner.temp }}/decky-runtime/decky-loader-runtime-linux-x86_64.zip
            ${{ runner.temp }}/decky-runtime/decky-loader-runtime-linux-x86_64.zip.sha256
            ${{ runner.temp }}/decky-runtime/SHA256SUMS
            ${{ runner.temp }}/decky-runtime/build-result.json
          if-no-files-found: error

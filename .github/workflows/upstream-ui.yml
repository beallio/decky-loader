name: Upstream UI Library

on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-ui
  cancel-in-progress: false

jobs:
  check:
    name: Compare the @decky/ui version with upstream
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      UPSTREAM: SteamDeckHomebrew/decky-loader
      LIBRARY: SteamDeckHomebrew/decky-frontend-lib
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Compare, then open, update or close the tracking issue
        run: |
          set -euo pipefail
          release="$(gh release view -R "$UPSTREAM" --json tagName --jq .tagName)"
          library="$(gh release view -R "$LIBRARY" --json tagName --jq .tagName)"

          gh api -H 'Accept: application/vnd.github.raw' "repos/$UPSTREAM/contents/frontend/pnpm-lock.yaml?ref=main" \
            > "$RUNNER_TEMP/upstream-main-pnpm-lock.yaml"
          gh api -H 'Accept: application/vnd.github.raw' "repos/$UPSTREAM/contents/frontend/pnpm-lock.yaml?ref=$release" \
            > "$RUNNER_TEMP/upstream-release-pnpm-lock.yaml"
          gh api "repos/$UPSTREAM/commits?path=frontend/pnpm-lock.yaml&per_page=5" \
            > "$RUNNER_TEMP/upstream-commits.json"

          report="$RUNNER_TEMP/upstream-ui-report.json"
          body="$RUNNER_TEMP/upstream-ui.md"
          python3 scripts/runtime/upstream_ui_check.py \
            --ours-lock frontend/pnpm-lock.yaml \
            --upstream-main-lock "$RUNNER_TEMP/upstream-main-pnpm-lock.yaml" \
            --upstream-release-lock "$RUNNER_TEMP/upstream-release-pnpm-lock.yaml" \
            --upstream-release-tag "$release" \
            --library-release "$library" \
            --repo "$GH_REPO" \
            --commits-json "$RUNNER_TEMP/upstream-commits.json" \
            --markdown "$body" > "$report"

          existing="$(gh issue list --label upstream-ui --state open --limit 1 --json number --jq '.[0].number // empty')"
          in_sync="$(jq -r '.in_sync' "$report")"
          close_comment="$(jq -r '.close_comment' "$report")"
          title="$(jq -r '.issue_title' "$report")"

          if [[ "$in_sync" == "true" ]]; then
            echo "$close_comment"
            if [[ -n "$existing" ]]; then
              gh issue close "$existing" --comment "$close_comment"
            fi
            exit 0
          fi

          gh label create upstream-ui --force \
            --description "Upstream Decky Loader uses a different @decky/ui version" --color 1D76DB
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --title "$title" --body-file "$body"
          else
            gh issue create --label upstream-ui --title "$title" --body-file "$body"
          fi

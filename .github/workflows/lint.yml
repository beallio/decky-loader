name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  lint:
    name: Check frontend formatting
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Use the runner temporary directory
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Read pinned tools
        id: config
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = json.loads(Path('backend-rust/build-config.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name in ('node', 'pnpm'):
                  print(f'{name}={config[name]}', file=output)
          PY
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ steps.config.outputs.node }}
      - name: Install locked frontend dependencies
        env:
          PNPM_VERSION: ${{ steps.config.outputs.pnpm }}
        run: |
          npm install --global "pnpm@$PNPM_VERSION"
          pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend run lint

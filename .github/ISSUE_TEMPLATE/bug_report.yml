name: Bug report
description: Report a problem with this fork.
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: Loader version
      description: Find this in Decky settings.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: SteamOS and Steam versions
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the steps that led to the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened?
  - type: textarea
    id: plugins
    attributes:
      label: Installed plugins
      description: Include names and versions if the problem involves a plugin.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Attach the ZIP from collect-debug-info.sh. Check it for personal details first.

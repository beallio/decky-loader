# Lint only fork-owned Python. Unchanged and overlaid upstream files keep upstream's style.
target-version = "py311"
line-length = 160
include = [
    "backend-rust/**/*.py",
    "scripts/**/*.py",
    "tests/**/*.py",
    "backend/worker_main.py",
    "backend/_decky_native_json.pyi",
    "backend/decky_loader/plugin/launcher.py",
    "backend/decky_loader/plugin/root_host.py",
    "backend/decky_loader/plugin/worker.py",
    "backend/decky_loader/plugin/imports/native.py",
]

[lint]
# Errors and pyflakes only: real mistakes, no style churn. Explicit so ruff upgrades do not change it.
select = ["E4", "E7", "E9", "F"]
# Scripts and tests put their own directories on sys.path before importing them.
ignore = ["E402"]

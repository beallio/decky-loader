# Fork-owned (replaces upstream's Poetry project). Runtime package versions must
# equal upstream's poetry.lock at the pinned SDK tag: scripts/runtime/python_parity.py.
[project]
name = "decky-loader"
# The SDK tag from backend-rust/build-config.json, without the "v".
version = "3.3.0"
description = "A plugin loader for the Steam Deck"
license = "GPL-2.0-only"
requires-python = ">=3.10,<3.15"
dependencies = [
    "aiohttp>=3.10.11,<4",
    "aiohttp-jinja2>=1.5.1,<2",
    "aiohttp-cors>=0.7.0,<0.8",
    "watchdog>=4,<5",
    "certifi",
    "packaging>=24,<25",
    "multidict>=6.0.5,<7",
    "setproctitle>=1.3.3,<2",
]

[project.scripts]
decky-loader = "decky_loader.main:main"

[dependency-groups]
dev = ["pyinstaller>=6.8.0,<7"]
typecheck = ["ty==0.0.86"]
# Run from the repository root; ruff.toml there selects the files.
lint = ["ruff==0.17.0"]

[build-system]
requires = ["uv_build==0.12.24"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "decky_loader"
module-root = ""
# decky_loader has no __init__.py.
namespace = true

[tool.ty.environment]
python-version = "3.14"
python-platform = "linux"

# Unchanged upstream file: its Python 3.12+ branch reads __qualname__ from Task.get_coro(),
# typed as Coroutine. Editing it would add an SDK overlay.
[[tool.ty.overrides]]
include = ["decky_loader/main.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

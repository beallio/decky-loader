[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "deny"
ignore = []

[licenses]
confidence-threshold = 0.95
include-dev = true
include-build = true
unused-allowed-license = "warn"
# Keep GPLv2 compatibility explicit. Apache-2.0-only dependencies are not
# approved; dual-licensed crates must offer an allowed alternative.
allow = [
    "GPL-2.0-only",
    "MIT",
    "ISC",
    "BSD-3-Clause",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "simplest-path"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[workspace]
members = [".", "native-json", "decky-plugin"]
default-members = ["."]
resolver = "3"

[package]
name = "decky-loader-runtime"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
brotli = "9"
encoding_rs = "0.8"
flate2 = "1"
futures-util = "0.3"
fancy-regex = "0.16"
libc = "0.2"
mime_guess = "2"
nix = { version = "0.31.3", default-features = false, features = ["dir", "fs", "inotify", "process", "signal", "user"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "charset", "gzip", "brotli", "deflate", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision", "raw_value"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.29"
tower-http = { version = "0.6", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
unicode-casefold = "0.2"
zip = { version = "9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs", "bzip2", "lzma"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true

[profile.native]
inherits = "release"
lto = "thin"

